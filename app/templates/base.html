<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{{ page_title }} | Enterprise Agentic Workflow Platform</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/css/custom.css" />
</head>
<body class="app-body">
  <header class="app-header">
    <div class="app-shell nav-shell">
      <div class="project-name">Enterprise Agentic Workflow Platform</div>
      <nav class="nav-links">
        <a href="/dashboard" class="nav-link">Dashboard</a>
      </nav>
    </div>
  </header>

  <main class="app-shell app-main">
    {% block content %}{% endblock %}
  </main>

  <footer class="app-footer">
    <div class="app-shell">Enterprise Agentic Workflow Platform — Demo</div>
  </footer>

  <script src="/static/js/app.js"></script>
</body>
</html>
